org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
# False, and it has to be. The generated Chromium R classes
# (tools/build/generate-chromium-r.py) forward every field to the app's R, and
# only a transitive R holds the AAR's resources for them to forward to.
android.nonTransitiveRClass=false
